# tmux — niri-setup
#
# COLOURS COME FROM THE LIVE PALETTE, not from this file. The colour block was
# replaced by a single `source-file` of tmux/theme.conf, which
# scripts/sync-external-theme.py generates from whatever palette quickshell has
# active (services/Theme.qml). That is what keeps the status bar, the pane
# borders and the 16 ANSI slots in step with the bar and popups when a theme
# changes or a new wallpaper is picked. `-q` means a missing fragment (before
# setup.sh has run the generator) is silently skipped rather than aborting the
# rest of this file.
#
# Behaviour, keybinds and the pane/status layout live here and are hand-written;
# only the colours are generated.
#
# Installed by setup.sh as
#   ~/.config/tmux/tmux.conf -> <repo>/tmux/tmux.conf  (sourced from ~/.tmux.conf)
#   ~/.config/tmux/theme.conf -> <repo>/tmux/theme.conf  (generated, gitignored)
# Reload after editing: prefix + r

# ── behaviour ──────────────────────────────────────────────────────────────
set -g default-terminal "alacritty"
set -g history-limit 500000
set -g mouse on
set -g focus-events on
set -s set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g display-time 3000
set -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}"
set -g set-titles on
set -g set-titles-string "#W"
set -as terminal-overrides ",*:Tc"

# ── theme colours (GENERATED — see tmux/theme.conf) ────────────────────────
# 16 pane-colours slots, status bar, pane borders, popups. Regenerate by
# switching theme or wallpaper (quickshell does it automatically), by hand with
#   python3 scripts/sync-external-theme.py
# or let setup.sh do it on a fresh install. Do not hardcode colours below.
source-file -q ~/.config/tmux/theme.conf

# ── status bar: top row, no margins, no clock ────────────────────────────
# Layout only; the colours live in the generated fragment above.
set -g status-position top
set -g status-justify left

# pane borders only — no blank spacer row, the bar is separated by its tint
setw -g pane-border-status off
setw -g pane-border-format ""

# popups (cheat sheet), messages, copy-mode indicator — colours in the fragment.

# ── keys ─────────────────────────────────────────────────────────────────
# C-b stays the prefix. C-a is aliased to it, so a C-a habit still works.
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "sunset tmux reloaded"
bind ? display-popup -k -w 90% -h 96% "bash ~/.config/tmux/cheatsheet.sh 2>/dev/null || echo 'cheatsheet missing — run setup.sh'"
bind F1 list-keys

# splits and new windows start in the folder you are already in
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# pickers — no need to remember window or session numbers
bind w choose-tree -w -Z
bind s choose-tree -Z
bind C command-prompt -p "new session:" "new-session -s '%%'"

# status-bar regions are clickable (tmux 3.7 routes by range: bare/Left/Right).
# left-click the search glyph / session name → tab picker, left-click + → new window.
# (Plain left-click on a tab still selects it via the default MouseDown1Status.)
bind -n MouseDown1StatusLeft choose-tree -Z
bind -n MouseDown1StatusRight new-window -c "#{pane_current_path}"

# destructive things ask first
bind x confirm-before -p "close pane #{pane_index}? (y/n)" "kill-pane"
bind _ confirm-before -p "close window #{window_index}? (y/n)" "kill-window"
bind & confirm-before -p "kill the whole tmux server? (y/n)" "kill-server"

# pane juggling
bind z resize-pane -Z
bind X swap-pane
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5

# ── copy mode + Wayland clipboard ────────────────────────────────────────
# v starts a selection, y copies it into the system clipboard
bind -T copy-mode v send-keys -X begin-selection
bind -T copy-mode y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode C-v send-keys -X page-down
bind -T copy-mode M-v send-keys -X page-up
# P pastes the system clipboard, no tmux buffer juggling
bind P run-shell 'tmux set-buffer -- "$(wl-paste -n)"' \; paste-buffer -d
# the wheel scrolls, and drops into copy mode when the pane is not in one
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'"
