# Kitty Terminal Configuration

# === Window Transparency ===
# Background opacity (0.0 = fully transparent, 1.0 = fully opaque)
background_opacity 0.7

# Dynamic opacity control (Ctrl+Alt+A to decrease, Ctrl+Alt+D to increase)
dynamic_background_opacity yes

# Blur (requires compositor support)
blur_radius 20
blur_passes 2

# === Font Settings ===
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

# === Cursor ===
cursor_shape block
cursor_blink_interval 0.5

# === Colors (Dark Theme) ===
foreground #eeeeee
background #000000
cursor #eeeeee
selection_foreground #000000
selection_background #eeeeee

# === Tab Bar ===
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #000000
active_tab_background #eeeeee
inactive_tab_foreground #aaaaaa
inactive_tab_background #333333

# === Window Borders ===
window_border_width 2
active_border_color #eeeeee
inactive_border_color #444444

# === Mouse ===
hide_cursor_when_typing yes

# === Scrollback ===
scrollback_lines 10000

# === Key Bindings ===
# Close window
map ctrl+shift+q close_window

# New tab
map ctrl+shift+t new_tab

# New window
map ctrl+shift+enter new_window

# Next/Previous tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Adjust opacity
map ctrl+alt+a set_background_opacity 0.6
map ctrl+alt+s set_background_opacity 0.8
map ctrl+alt+d set_background_opacity 1.0
