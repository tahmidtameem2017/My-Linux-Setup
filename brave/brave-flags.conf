# Brave hardware-acceleration / performance flags
# Installed to ~/.config/brave-flags.conf (read by /usr/bin/brave wrapper, one flag per line).
# Tuned for: Intel HD Graphics 5500 (Broadwell BDW GT2, i7-5600U) + Mesa + Niri/Wayland + Brave ~1.93 (Chromium 151).
#
# What this does:
#  - Forces native Wayland (no XWayland CPU overhead, better vsync under niri).
#  - Un-blocklists the old Broadwell GPU so Chromium actually uses it.
#  - Moves compositing + rasterization + canvas off CPU onto the iGPU
#    (zero-copy + native GMB video frames = no extra CPU copies).
#  - Enables VA-API video decode/encode so H.264/VP8 video decodes on GPU
#    instead of the CPU. NOTE: this chip has NO VP9/HEVC/AV1 fixed-function
#    hardware (see vainfo: MPEG2/H264/VC1/VP8/JPEG only), so YouTube VP9/AV1
#    will still be CPU-decoded unless you force H.264 (see BOTTOM).
#  - Uses the mature ANGLE-on-OpenGL path (not Vulkan) — more stable and
#    lower-overhead on Gen8 Broadwell than ANGLE-on-Vulkan.
#
# Verify after restart: brave://gpu should show
#   Canvas / Compositing / Rasterization / Video Decode: "Hardware accelerated"
#   GL_RENDERER: Mesa Intel HD Graphics 5500. Play a video, then check
#   `intel_gpu_top` (video column > 0%) and lower `brave --type=renderer` CPU.
#
# Wayland-native (avoids XWayland translation + extra copies)
--ozone-platform-hint=auto

# Stop Chromium from blocklisting this 2015 iGPU (the #1 reason CPU stays high)
--ignore-gpu-blocklist

# Push work to GPU: composited layers, raster, canvas, zero-copy textures
--enable-gpu-rasterization
--enable-zero-copy
--enable-native-gpu-memory-buffers
--enable-gpu-memory-buffer-video-frames

# ANGLE on OpenGL (stable + low overhead on Broadwell; Vulkan ANGLE is
# glitchier/hungrier on Gen8 — only switch to --use-angle=vulkan if you
# test it and brave://gpu stays clean)
--use-gl=angle
--use-angle=gl

# VA-API decode + encode on Linux (Chromium 131+ names; VaapiVideoDecoder is dead).
# VaapiIgnoreDriverChecks is needed for the old i965/iHD Broadwell drivers.
# ParallelDownloading is a free throughput win. UseChromeOSDirectVideoDecoder
# is disabled so the VA-API path is actually used.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiIgnoreDriverChecks,ParallelDownloading
--disable-features=UseChromeOSDirectVideoDecoder

# ── RAM usage (7.6 GB box) ───────────────────────────────────────────────
# Fewer renderer processes: share one per site + hard cap at 4. Chromium
# isolates every tab by default; on 4 threads / 7.6 GB that wastes hundreds
# of MB. Trade-off: slightly less crash isolation between same-site tabs.
--process-per-site
--renderer-process-limit=4

# Cap each renderer's V8 heap at 1 GB (64-bit default lets it grow to ~2 GB+
# before aggressive GC). Forces earlier garbage collection: less peak RAM,
# marginally more GC CPU. 1024 is safe for video sites; do NOT go below 512.
--js-flags=--max-old-space-size=1024

# Cap disk cache at 100 MB (default: unbounded % of disk). Less cache =
# less memory-mapped churn on this small machine. Slightly more re-downloads.
--disk-cache-size=104857600

# ── Faster startup ───────────────────────────────────────────────────────
# Skip the "is Brave your default browser?" check and the crash-reporter
# init on every launch. Both cost disk I/O + process spawns at startup for
# zero runtime benefit. (Component updates / Safe Browsing left untouched.)
--no-default-browser-check
--disable-breakpad

# ── BOTTOM: the YouTube trap (read this) ─────────────────────────────────
# Your HD 5500 cannot hardware-decode VP9 / AV1 / HEVC. YouTube serves those
# by default, so 1080p60/4K stays on the CPU no matter what flags you set.
# Biggest real-world CPU win: force H.264 and cap resolution:
#   1. Install "enhanced-h264ify" (or "h264ify") from the Chrome Web Store,
#      enable it, block VP9 + AV1 (keep H.264 allowed).
#   2. In Brave: Settings → System → ON: "Use hardware acceleration when available".
#      Settings → Performance → ON: Memory Saver + Energy Saver.
#   3. Keep Brave Shields UP (blocks ads/trackers = less CPU/JS per page).
#   4. Cap YouTube at 1080p (this iGPU + 2c/4t CPU can't do 4K smoothly anyway;
#      fullscreen video also lets niri direct-scanout the frame).
