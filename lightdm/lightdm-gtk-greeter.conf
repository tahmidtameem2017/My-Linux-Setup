# lightdm/lightdm-gtk-greeter.conf — Sunset Orange AMOLED fallback
# SDDM is live (systemctl is-enabled sddm == enabled), this is fallback only.
# Install manually if you switch to LightDM:
#   sudo cp lightdm/lightdm-gtk-greeter.conf /etc/lightdm/lightdm-gtk-greeter.conf
[greeter]
background=#000000
theme-name=Colloid-Dark
icon-theme-name=Colloid
cursor-theme-name=Adwaita
cursor-theme-size=24
font-name=JetBrainsMono Nerd Font 11
xft-antialias=true
xft-hintstyle=hintfull
xft-rgba=rgb
indicators=~host;~spacer;~clock;~spacer;~session;~language;~a11y;~power
clock-format=%H:%M
position=50% 50%
screensaver-timeout=60
user-background=false
transition-duration=200
default-user-image=#avatar-default
hide-user-image=false
round-user-image=false
highlight-logged-user=true
# Sunset palette reference (GTK CSS handles actual widget colors):
# bg #000000 panel #0a0a0a row #141010 border #1a1210 borderStrong #3D2B24
# accent #E85D2F accentHover #FF8B4A text #F7C7A1 muted #7C8A6A dim #555555 danger #c30505
